<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Historical Data — Sports Trading App</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7f9; --line: #d8dee6; --ink: #1a1f26;
    --muted: #5c6773; --accent: #2563eb; --good: #1a7f37; --bad: #d1242f; --warn: #9a6700;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  header { padding: 14px 20px; border-bottom: 1px solid var(--line);
    display: flex; align-items: center; gap: 12px; background: var(--panel); position: sticky; top: 0; }
  header h1 { font-size: 16px; margin: 0; }
  header .badge { font-size: 11px; color: var(--warn); border: 1px solid var(--warn); padding: 1px 7px; border-radius: 99px; }
  header a { color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
  header .spacer { margin-left: auto; }
  header a + a { margin-left: 14px; }
  main { max-width: 1000px; margin: 0 auto; padding: 20px; }
  .kpi { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; margin-bottom: 18px; }
  .kpi div { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .kpi small { color: var(--muted); display: block; font-size: 11px; }
  .kpi b { font-size: 18px; }
  h2 { font-size: 15px; margin: 18px 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
  .pos { color: var(--good); } .neg { color: var(--bad); }
  .muted { color: var(--muted); }
  .win { color: var(--good); font-weight: 700; } .loss { color: var(--bad); font-weight: 700; }
  .wrap { overflow-x: auto; }
  .kinds { display: flex; gap: 24px; flex-wrap: wrap; font-size: 13px; margin-bottom: 6px; }
  @media (max-width: 780px) { .kpi { grid-template-columns: repeat(3, 1fr); } }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 8px;
    padding: 7px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
  .tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .tabpanel { display: none; } .tabpanel.active { display: block; }
</style>
</head>
<body>
<header>
  <h1>Historical Data</h1>
  <span class="badge">⚪ SIM &amp; 🔴 LIVE — separate</span>
  <span class="spacer"></span>
  <a href="/">← Dashboard</a>
  <a href="/spec">📋 Spec</a>
</header>

<main>
  <div id="content"><p class="muted">Loading…</p></div>
</main>

<script>
const fmt = (c) => (c == null ? '—' : (c < 0 ? '-$' : '$') + (Math.abs(c) / 100).toFixed(2));
const cls = (c) => (c == null ? '' : c < 0 ? 'neg' : c > 0 ? 'pos' : '');

// Render one ledger (a /api/history payload) with a heading.
function renderLedger(h, title, blurb) {
  let html = `<h2>${title}</h2>`;
  if (!h || !h.count) {
    return html + `<p class="muted">${blurb} — nothing recorded yet.</p>`;
  }
  const k = h.kinds || {};
  html += `
    <div class="kpi">
      <div><small>Record</small><b>${h.wins}W–${h.losses}L</b></div>
      <div><small>Win rate</small><b>${h.winRatePct == null ? '—' : h.winRatePct + '%'}</b></div>
      <div><small>Total profit</small><b class="${cls(h.totalRealizedCents)}">${fmt(h.totalRealizedCents)}</b></div>
      <div><small>ROI</small><b class="${cls(h.totalRealizedCents)}">${h.roiPct}%</b></div>
      <div><small>Best</small><b class="pos">${fmt(h.bestCents)}</b></div>
      <div><small>Worst</small><b class="neg">${fmt(h.worstCents)}</b></div>
    </div>`;
  if (k.verdict) {
    const s = k.single, c = k.combo;
    html += `<div class="kinds">
      <span><b>Singles:</b> ${s.n ? `${s.wins}/${s.n} won, avg ${fmt(s.avgRealizedCents)}` : '—'}</span>
      <span><b>Combos:</b> ${c.n ? `${c.wins}/${c.n} won, avg ${fmt(c.avgRealizedCents)}` : '—'}</span>
      <span class="muted">🧭 ${k.verdict}</span>
    </div>`;
  }
  html += '<div class="wrap"><table><thead><tr>' +
    '<th>When</th><th>Pick</th><th>Kind</th><th>Entry</th><th>Exit</th><th>Ctr</th><th>Stake</th><th>Result</th><th>Profit</th><th>ROI</th>' +
    '</tr></thead><tbody>';
  for (const d of [...h.items].reverse()) { // newest first
    const when = d.ts ? new Date(d.ts).toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '—';
    const game = d.team == null ? '—'
      : (d.kind === 'combo'
          ? `🎯 Parlay: <b>${d.team}</b>`
          : `🎯 <b>${d.team}</b> to win${d.opponent ? ` <span class="muted">vs ${d.opponent}</span>` : ''}`);
    const exit = d.exitPriceCents != null
      ? `${d.exitPriceCents}¢${d.settlement ? ` (${d.settlement})` : ''}`
      : (d.settlement ? d.settlement.toUpperCase() : '—');
    html += `<tr>
      <td class="muted">${when}</td>
      <td>${game}</td>
      <td>${d.kind}</td>
      <td>${d.entryPriceCents != null ? d.entryPriceCents + '¢' : '—'}</td>
      <td>${exit}</td>
      <td>${d.contracts ?? '—'}</td>
      <td>${fmt(d.stakeCents)}</td>
      <td class="${d.won ? 'win' : 'loss'}">${d.won ? 'WIN' : 'LOSS'}</td>
      <td class="${cls(d.realizedPureProfitCents)}">${fmt(d.realizedPureProfitCents)}</td>
      <td class="${cls(d.realizedPureProfitCents)}">${d.roiPct != null ? d.roiPct + '%' : '—'}</td>
    </tr>`;
  }
  html += '</tbody></table></div>';
  return html;
}

async function load() {
  let sim, live;
  try {
    sim = (await (await fetch('/api/history?mode=sim')).json()).history;
    live = (await (await fetch('/api/history?mode=live')).json()).history;
  } catch (e) {
    document.getElementById('content').innerHTML = '<p class="neg">Could not load history: ' + e.message + '</p>';
    return;
  }
  // Separate tabs — Simulation and Live are never mixed. Default to ?mode= (from the
  // dashboard link), else Simulation.
  const params = new URLSearchParams(location.search);
  const start = params.get('mode') === 'live' ? 'live' : 'sim';
  let html = '<div class="tabs">' +
    `<button class="tab" data-tab="sim" onclick="showTab('sim')">⚪ Simulation</button>` +
    `<button class="tab" data-tab="live" onclick="showTab('live')">🔴 Live</button>` +
    '</div>';
  html += `<div class="tabpanel" id="tab-sim">${renderLedger(sim, '⚪ Simulation decisions', 'Practice decisions')}</div>`;
  html += `<div class="tabpanel" id="tab-live">${renderLedger(live, '🔴 Live decisions', 'Real Kalshi decisions')}</div>`;
  html += '<p class="muted" style="font-size:12px;margin-top:16px">Two separate ledgers — Simulation and Live are never mixed. Each survives restarts and is wiped only by its own “Clear all”.</p>';
  document.getElementById('content').innerHTML = html;
  showTab(start);
}
function showTab(which) {
  for (const el of document.querySelectorAll('.tab')) el.classList.toggle('active', el.dataset.tab === which);
  for (const el of document.querySelectorAll('.tabpanel')) el.classList.toggle('active', el.id === 'tab-' + which);
}
load();
</script>
</body>
</html>
